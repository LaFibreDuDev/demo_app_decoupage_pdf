services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app                  # hot reload — code source monté en live
      - pdf_sessions:/tmp/pdf_splitter  # persistance des sessions entre redémarrages
    env_file: ./backend/.env
    environment:
      # frontend.localhost achemine les appels API via nginx (même origine)
      # → pas de CORS cross-origin, mais on déclare l'origine pour sécurité
      - ALLOWED_ORIGINS=http://frontend.localhost:8080
      - TEMP_DIR=/tmp/pdf_splitter
    restart: unless-stopped

  # ── Frontend Vite ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app          # hot reload — code source monté en live
      - /app/node_modules        # volume anonyme : protège node_modules de l'image
    environment:
      # Le client HMR doit se connecter au port nginx exposé (8080), pas au port Vite interne
      - VITE_HMR_CLIENT_PORT=8080
    restart: unless-stopped

volumes:
  pdf_sessions:
