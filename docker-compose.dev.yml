services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app                  # hot reload — code source monté en live
      - pdf_sessions:/tmp/pdf_splitter  # persistance des sessions entre redémarrages
    env_file: ./backend/.env
    environment:
      # En mode Docker, le navigateur passe par nginx (http://localhost)
      - ALLOWED_ORIGINS=http://localhost
      - TEMP_DIR=/tmp/pdf_splitter
    restart: unless-stopped

  # ── Frontend Vite ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app          # hot reload — code source monté en live
      - /app/node_modules        # volume anonyme : protège node_modules de l'image
    environment:
      # Le client HMR doit se connecter au port nginx (80), pas au port Vite interne
      - VITE_HMR_CLIENT_PORT=80
    restart: unless-stopped

volumes:
  pdf_sessions:
