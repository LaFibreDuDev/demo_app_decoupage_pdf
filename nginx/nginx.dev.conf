# Gestion de l'upgrade WebSocket (HMR Vite)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;

    # Taille max des uploads (doit correspondre à UPLOAD_MAX_SIZE_MB)
    client_max_body_size 10m;

    # ── Routes API ──────────────────────────────────────────────────────────
    location ~ ^/(upload|split|thumbs) {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # génération de miniatures peut prendre du temps
    }

    # ── Frontend Vite (+ WebSocket HMR) ────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }
}
