# Gestion de l'upgrade WebSocket (HMR Vite)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

# ── frontend.localhost — point d'entrée de l'application ───────────────────
server {
    listen 80;
    server_name frontend.localhost;

    # Taille max des uploads (doit correspondre à UPLOAD_MAX_SIZE_MB)
    client_max_body_size 10m;

    # Routes API : proxifiées vers le backend (même origin → pas de CORS)
    location ~ ^/(upload|split|thumbs) {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Tout le reste + WebSocket HMR → Vite dev server
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── backend.localhost — accès direct à l'API (curl, Postman…) ─────────────
server {
    listen 80;
    server_name backend.localhost;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
