server {
    listen 80;

    # Résolution DNS dynamique via le resolver Docker embarqué
    # (évite de cacher l'IP du backend au démarrage de nginx)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Taille max des uploads (doit correspondre à UPLOAD_MAX_SIZE_MB)
    client_max_body_size 10m;

    # Fichiers statiques du frontend compilé
    root /usr/share/nginx/html;
    index index.html;

    # ── Routes API ─────────────────────────────────────────────────────────
    location ~ ^/(upload|split|thumbs) {
        set $backend http://pdf_backend:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── SPA fallback (Vue Router history mode) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
