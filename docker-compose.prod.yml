services:

  # ── Frontend (statique) + reverse proxy ───────────────────────────────────
  # Ce service contient DEUX choses grâce au build multi-stage (nginx/Dockerfile.prod) :
  #   1. Le frontend Vue/Vite compilé en fichiers statiques (npm run build)
  #   2. Nginx qui sert ces fichiers et proxifie l'API vers le backend
  # Il n'y a donc pas de service "frontend" séparé en prod : il est intégré ici.
  # Dockploy expose ce service via HTTPS — nginx écoute en HTTP sur 80.
  pdf_nginx:
    build:
      context: .                        # contexte = racine du projet
      dockerfile: nginx/Dockerfile.prod # build multi-stage : node → nginx
      args:
        - VITE_UPLOAD_MAX_SIZE_MB=${VITE_UPLOAD_MAX_SIZE_MB:-10}
    # ports:
    #  - "80:80"
    depends_on:
      - pdf_backend
    networks:
      - pdf_app_network
    restart: unless-stopped

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  pdf_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      - pdf_sessions:/tmp/pdf_splitter  # persistance des sessions
    environment:
      - UPLOAD_MAX_SIZE_MB=${UPLOAD_MAX_SIZE_MB:-10}
      - TEMP_DIR=${TEMP_DIR:-/tmp/pdf_splitter}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      - THUMB_DPI=${THUMB_DPI:-150}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    networks:
      - pdf_app_network
    restart: unless-stopped

volumes:
  pdf_sessions:

networks:
  pdf_app_network:
